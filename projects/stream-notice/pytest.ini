[pytest]
testpaths = tests
# La regresión real mueve el ratón y usa Twitch/IGDB de verdad: solo se ejecuta pidiéndola con -m real
addopts = -m "not real"
markers =
    gui: abre ventanas de la app (necesita el escritorio de Windows)
    real: clicks y teclas reales del ratón/teclado contra Twitch e IGDB reales; solo con -m real
